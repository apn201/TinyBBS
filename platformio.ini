[platformio]
default_envs = tinybbs_s3
src_dir = src
build_dir = .pio-tinybbs

[env:tinybbs_s3]
platform = espressif32
board = esp32-s3-devkitc1-n16r8
framework = arduino
monitor_speed = 115200
# N16R8 uses the board's QIO-flash/OPI-PSRAM runtime image. Direct recovery
# flashes must use DIO transfer mode; do not override the build profile here.
lib_deps =
  moononournation/GFX Library for Arduino @ ^1.5.9
build_flags =
  -D CORE_DEBUG_LEVEL=1
