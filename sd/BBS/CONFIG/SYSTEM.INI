; Board settings. Edit, then type RELOAD as SysOp (or reboot).
; The board's whole identity is here and in the art files: no name, logo or
; picture is fixed in the firmware. The same card works on the ESP32 stick
; and on the server.
[SYSTEM]
; Shown on the S (system info) screen, in page titles and in place of
; missing art.
name=KOUVOSTO BBS
; The short name in the browser's status line ("KOUVOSTO // CONNECT").
; Empty = the name without " BBS".
short_name=KOUVOSTO
location=HELSINKI, FINLAND
sysop=SYSOP
; Callers allowed at once, 1-8. Browser and Telnet share these nodes.
max_nodes=8
; Security level for new accounts. Conferences, bulletins and file areas
; compare against it.
new_user_level=20
; Modem speed for ANSI pictures opened with V in a file area, in the browser
; until the caller picks one with the SPEED button. Telnet is always full
; speed. 0 = no limit.
baud=28800
; Downloads. A new account may download new_user_credits, plus new_user_ratio
; times what it uploads (0 = no ratio, download freely). Sizes like 500K, 1M.
; Accounts made before these settings keep theirs; change them in the user
; editor.
new_user_credits=1M
new_user_ratio=3
; Download credit earned for each message posted, and for each KB uploaded
; (on top of the ratio). 0 turns that way of earning off.
credits_per_message=50K
credits_per_upload_kb=0
; Largest file a browser caller may upload, e.g. 2M. 0 = no uploads anywhere.
; An area also needs uploads=1 in its AREA.INI. Uploads wait in
; UPLOADS/INCOMING until the SysOp approves them (SysOp console, I).
upload_max=2M
; The board clock. The stick has no real clock, so time starts here and only
; runs while the stick has power. It carries on after a reboot. Change the
; date to restart the clock from it.
epoch=1997-03-14 21:00
; clock_sync=browser pulls the clock forward to a browser caller's local time,
; moved back to the 1990s in steps of 28 years so the weekday still matches
; (2026 becomes 1998). The clock never goes backwards. Leave empty to keep the
; clock to itself.
clock_sync=browser
; Art files, relative to /BBS on the card.
welcome=ANSI/LOGIN/WELCOME.ANS
main_menu=ANSI/MENUS/MAIN.ANS
goodbye=ANSI/GOODBYE/GOODBYE.ANS
; The ESP32 status screen's logo: raw RGB565, 160 wide, up to 53 rows.
; tools/make-lcd-logo.py makes one from a picture. Missing = the built-in one.
lcd_logo=ASSETS/LOGO.RGB565

; Door names in the menus, by the door's menu key. Empty = the door's own name.
[DOORS]
L=Legend of Kouvola
V=VolaMUD
D=Dice cabinet
