; Board settings. Edit, then type RELOAD as SysOp (or reboot).
[SYSTEM]
; Shown on the S (system info) screen and in place of missing art.
name=KOUVOSTO BBS
location=HELSINKI, FINLAND
sysop=SYSOP
; Callers allowed at once, 1-8. Browser and Telnet share these nodes.
max_nodes=8
; Security level for new accounts. Conferences, bulletins and file areas
; compare against it.
new_user_level=20
; Modem speed for ANSI pictures opened with V in a file area. Telnet uses
; this; the browser's SPEED button overrides it. 0 = no limit.
baud=28800
; Art files, relative to /BBS on the card.
welcome=ANSI/LOGIN/WELCOME.ANS
main_menu=ANSI/MENUS/MAIN.ANS
goodbye=ANSI/GOODBYE/GOODBYE.ANS
