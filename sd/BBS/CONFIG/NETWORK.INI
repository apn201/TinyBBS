; The board's own WiFi network. Read at boot only: restart after editing.
; The board never joins another network.
[NETWORK]
ssid=THE_BOARD
; Empty for an open network. A password needs at least 8 characters,
; otherwise the board starts an open network anyway.
password=
; WiFi channel 1-13.
channel=1
; Phones and computers allowed on the network at once.
max_wifi_clients=10
telnet_port=23
