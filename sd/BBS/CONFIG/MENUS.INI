; Menus: header art, and where in the art the options go. The options
; themselves come from the board: only what exists and what the caller may
; use is listed. Edit, then type RELOAD as SysOp.
;
; art=      the picture, relative to /BBS on the card
; row, col= where the first option goes on the screen (row 1 = the top)
; columns=  options side by side
; width=    characters per column
; rows=     rows of options that fit in the art. Options that do not fit,
;           or all of them with rows=0 or no row=, go below the art.
; Leave the option area of the picture empty: the board writes into it.

[MAIN]
art=ANSI/MENUS/MAIN.ANS
row=13
col=3
columns=2
width=21
rows=8

[MESSAGES]
art=ANSI/MENUS/MESSAGES.ANS
row=5
col=3
columns=2
width=21
rows=4

[GALLERY]
art=ANSI/MENUS/GALLERY.ANS
row=5
col=3
columns=1
width=40
rows=4

[DOORS]
art=ANSI/MENUS/DOORS.ANS
row=5
col=3
columns=1
width=40
rows=4
